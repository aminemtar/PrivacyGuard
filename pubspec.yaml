name: privacy_guard
description: On-device shoulder-surfing signals and in-app privacy protection.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_commons: ^0.11.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
